<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGMTIO</title>
<meta name="description" content="Release and marketing work in one view. Sample data.">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #14130f;
  --text: #efeee8;
  --muted: #c9c4b6;
  --gold: #c9a35b;
  --green: #273c34;
  --line: rgba(239, 238, 232, .18);
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: "Instrument Sans", system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  overflow-x: hidden;
}
.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 20px; }
header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-top: 22px;
}
.brand {
  display: inline-flex; align-items: center; gap: 10px; min-height: 44px;
  color: var(--text); text-decoration: none;
  font-weight: 600; font-size: 16px;
}
.back {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 999px; background: rgba(12, 11, 10, .55);
  border: 1px solid rgba(239, 238, 232, .35);
  color: var(--text); text-decoration: none; font-size: 15px; font-weight: 500;
  white-space: nowrap;
}
.back:hover { border-color: var(--gold); }
a:focus-visible, button:focus-visible {
  outline: 3px solid var(--gold); outline-offset: 3px;
}
h1 {
  margin: clamp(36px, 7vw, 72px) 0 0;
  font-family: "Instrument Serif", Georgia, serif;
  font-weight: 400;
  font-size: clamp(48px, 9vw, 72px);
  line-height: .98;
  letter-spacing: -0.02em;
}
.lede { margin: 18px 0 0; max-width: 46ch; color: var(--muted); }
[role="tablist"] {
  display: flex; gap: 8px; margin-top: 32px;
  border-bottom: 1px solid var(--line);
}
[role="tab"] {
  appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
  margin-bottom: -1px; min-height: 44px; padding: 0 18px;
  color: var(--muted); font: 500 16px "Instrument Sans", system-ui, sans-serif;
  cursor: pointer;
}
[role="tab"]:hover { color: var(--text); }
[role="tab"][aria-selected="true"] { color: var(--text); border-bottom-color: var(--gold); }
[role="tabpanel"] { margin-top: 20px; }
[role="tabpanel"][hidden] { display: none; }
.frame {
  width: 100%; height: 78dvh; min-height: 480px;
  background: var(--green);
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}
.frame iframe { display: block; width: 100%; height: 100%; border: 0; }
main { padding-bottom: 56px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
<!--hall-pill-css--><link rel="stylesheet" href="../universe/hallpill.css"><!--/hall-pill-css--></head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="../index.html" aria-label="Jash Shah, home">
      <svg width="38" height="26" viewBox="0 0 38 26" fill="none" stroke="#efeee8" stroke-width="1.8" aria-hidden="true"><path d="M19 13C14 3 4 3 4 13s10 10 15 0S34 3 34 13s-10 10-15 0Z"/></svg>
      <span>Jash Shah</span>
    </a>
    <a class="back" href="../index.html#mgmtio">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"/></svg>
      Back to the hall
    </a>
  </header>
  <main>
    <h1>MGMTIO</h1>
    <p class="lede">Release and marketing work in one view. Sample data.</p>

    <div role="tablist" aria-label="MGMTIO screens">
      <button role="tab" id="tab-execution" aria-controls="panel-execution" aria-selected="true" tabindex="0" type="button">Execution</button>
      <button role="tab" id="tab-tracking" aria-controls="panel-tracking" aria-selected="false" tabindex="-1" type="button">Tracking</button>
    </div>
    <div role="tabpanel" id="panel-execution" aria-labelledby="tab-execution">
      <div class="frame"><iframe title="MGMTIO Execution screen with sample data" src="execution.html" loading="lazy"></iframe></div>
    </div>
    <div role="tabpanel" id="panel-tracking" aria-labelledby="tab-tracking" hidden>
      <div class="frame"><iframe title="MGMTIO Tracking screen with sample data" src="tracking.html" loading="lazy"></iframe></div>
    </div>
  </main>
</div>
<script>
(function () {
  var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
  function select(tab, focus) {
    tabs.forEach(function (t) {
      var on = t === tab;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
    if (focus) tab.focus();
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { select(t, false); });
    t.addEventListener('keydown', function (e) {
      var n = null;
      if (e.key === 'ArrowRight') n = tabs[(i + 1) % tabs.length];
      else if (e.key === 'ArrowLeft') n = tabs[(i - 1 + tabs.length) % tabs.length];
      else if (e.key === 'Home') n = tabs[0];
      else if (e.key === 'End') n = tabs[tabs.length - 1];
      if (n) { e.preventDefault(); select(n, true); }
    });
  });
})();
</script>

</html>
