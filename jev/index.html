/* Workshop / software. One story, expressed as an object and as an interface. */
:root { --soft-purple: #ede6f1; --soft-green: #e5ece3; }
body { background: radial-gradient(ellipse at 64% 35%, #fffcf3, #f3efe5 70%); }
.masthead { background: #f6f2e9c9; }
.message-card {
  background: linear-gradient(120deg, #fffdf7, #f7f0e0);
  box-shadow: 0 3px 0 #e5dcc9, 0 9px 25px #493a1910;
}
.message-card::after {
  content: ''; position: absolute; right: 0; bottom: 0;
  border: 9px solid transparent; border-top-color: #e9dec4; border-left-color: #e9dec4;
  border-radius: 4px 0 7px 0; pointer-events: none;
}
.representation-bar {
  position: absolute; inset: 0 0 auto; z-index: 8;
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
  min-height: 58px; padding: 0 0 13px; border-bottom: 1px solid #d5d5c5;
}
.representation-bar .eyebrow { display: block; font: 9px/1.8 'Courier New', monospace; letter-spacing: .10em; }
.representation-bar b { display: block; font-size: 12px; font-weight: 400; line-height: 1.5; }
#toggle-representation {
  display: flex; gap: 15px; align-items: center; justify-content: center;
  flex-shrink: 0; background: #2c4237; color: #fffaf0; border-color: #2c4237;
  border-radius: 8px; min-height: 43px; font-size: 12px; padding: 11px 15px;
  box-shadow: 0 3px 7px #2c423712;
}
#toggle-representation[aria-pressed=true] { background: transparent; color: #2c4237; border-color: #b7c0af; box-shadow: none; }
#toggle-representation:hover { background: #41604e; color: #fffaf0; }
.viewbar { top: 70px; }
#stage { inset: 85px 0 30px; }
.exhibit { min-height: 525px; }
.exhibit.is-software { min-height: 0; padding-top: 77px; }
#software-layer { position: relative; inset: auto; }
.translation-card { grid-area: 2 / 1; padding: 5px 0 8px; }
.translation-card h2 { font: 33px/1.1 Georgia, serif; letter-spacing: -.04em; margin: 11px 0 22px; }
.translation-card > div { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding: 11px 0; font-size: 12px; }
.translation-card > div span { color: var(--muted); }
.translation-card > div b { font-weight: 500; }
.translation-card > p:last-child { font-size: 11px; color: var(--muted); line-height: 1.6; margin-top: 13px; }
.has-software .message-card { display: none; }
.has-software .exhibit { background: none; }
.has-software .outcomes { background: #fffdf8; }
.inbox-shell {
  background: #fffdfa; border: 1px solid #cecfc5; border-radius: 13px; overflow: hidden;
  box-shadow: 0 6px 0 #e2ded166, 0 20px 55px #33412d0d;
  color: #2b3a31; font-family: Arial, Helvetica, sans-serif;
}
.inbox-chrome {
  padding: 14px 21px; display: flex; align-items: center; gap: 11px;
  min-height: 66px; background: #faf8f2; border-bottom: 1px solid #e0e0d6;
}
.inbox-logo { background: #315e4c; color: #fff9eb; width: 31px; height: 31px; border-radius: 9px; font: italic 29px Georgia, serif; text-align: center; }
.inbox-logo > span { color: #d5bd7d; }
.inbox-chrome > div { display: grid; gap: 3px; }
.inbox-chrome b { font-size: 12px; }
.inbox-chrome div span { font-size: 10px; color: #6b776b; }
.demo-badge { margin-left: auto; font: 8px/1.6 'Courier New', monospace; letter-spacing: .07em; color: #7d6951; border: 1px solid #daceb7; border-radius: 4px; padding: 5px 8px; background: #fbf5e8; }
.inbox-workspace { display: grid; grid-template-columns: 151px minmax(0, 1fr); }
.inbox-folders { background: #f4f5ee; border-right: 1px solid #e0e3d7; padding: 19px 11px; }
.folder-title { display: block; color: #7a8374; font-size: 8px; letter-spacing: .10em; padding: 0 9px 15px; }
.inbox-folders > button { width: 100%; display: flex; align-items: center; gap: 8px; border: 1px solid transparent; border-radius: 6px; font-size: 11px; min-height: 41px; padding: 8px 9px; margin-bottom: 3px; }

u2197</button><span>1 example message</span></div>\n          <article class=\"inbox-message\" id=\"software-message\" data-map-target=\"message\">\n            <div class=\"inbox-sender\"><span class=\"customer-avatar\">C</span><div><b>Pretend customer</b><span id=\"software-subject\">Wrong size</span></div><span class=\"message-id\">EXAMPLE 01</span></div>\n            <p class=\"customer-copy\" id=\"software-copy\"></p>\n            <div class=\"suggestion-strip\" data-map-target=\"label\">\n              <span class=\"suggestion-monogram\">J</span>\n              <div><span>Jev\u2019s suggested category</span><b id=\"software-answer\">Not asked yet</b></div>\n              <span class=\"suggestion-status\" id=\"software-answer-status\">Waiting</span>\n            </div>\n            <p class=\"software-clue\" id=\"software-clue\">A question will be sent with the message.</p>\n          </article>\n          <div class=\"inbox-empty\" id=\"software-empty\" hidden>\n            ${icon('inbox')}<b>No example in this folder.</b><p id=\"software-empty-copy\"></p><button id=\"software-find\">Find this message \u2197</button>\n          </div>\n          <section class=\"inbox-rule\" data-map-target=\"rule\" aria-label=\"The example app routing rule\">\n            <div class=\"rule-heading\"><span class=\"rule-symbol\">\u2197</span><div><b>Your app\u2019s rule</b><span>You choose what happens.</span></div></div>\n            <div class=\"rule-options\" role=\"group\" aria-label=\"Choose a routing rule\">\n              <button id=\"software-normal\" aria-pressed=\"true\">Use a clear suggestion</button>\n              <button id=\"software-review\" aria-pressed=\"false\">Ask a person first</button>\n            </div>\n            <p id=\"software-rule-copy\">Unclear answers still go to a person.</p>\n          </section>\n          <div class=\"inbox-action-row\"><span id=\"software-next-hint\">Step 1 of 4</span><button id=\"software-next\">Ask Jev <span aria-hidden=\"true\">\u2192</span></button></div>\n        </div>\n      </div>\n      <footer class=\"inbox-activity\" data-map-target=\"folder\">\n        <span class=\"activity-dot\"></span><div><b id=\"software-activity\">Received in Unassigned</b><span id=\"software-activity-copy\">Only an example. No reply or refund is sent.</span></div>\n      </footer>\n    </div>\n    <p class=\"software-footnote\">Same message. Same answer. The machine was a picture of this workflow.</p>`;\n\n  const $ = selector => host.querySelector(selector);\n  const $$ = selector => [...host.querySelectorAll(selector)];\n  host.addEventListener('click', event => {\n    const button = event.target.closest('button');\n    if (!button) return;\n    if (button.dataset.folder) {\n      selectedFolder = button.dataset.folder;\n      update();\n    }\n    if (button.id === 'software-find') {\n      selectedFolder = lastLocation;\n      update();\n    }\n    if (button.id === 'software-normal') callbacks.policy(false);\n    if (button.id === 'software-review') callbacks.policy(true);\n    if (button.id === 'software-next') callbacks.next();\n  });\n\n  function update() {\n    const { state, example, destination } = callbacks.read();\n    const location = state.stop === 3 ? destination : 'inbox';\n    const answered = state.progress >= 1;\n    const planned = state.progress >= 2;\n    if (lastLocation !== location || lastSample !== state.sample) {\n      selectedFolder = location;\n    }\n    lastLocation = location;\n    lastSample = state.sample;\n    host.dataset.step = String(state.stop);\n    host.dataset.route = destination;\n    $('#software-copy').textContent = example.text;\n    $('#software-subject').textContent = example.name;\n    $('.message-id').textContent = `EXAMPLE 0${state.sample + 1}`;\n    $('#software-folder').textContent = folders[selectedFolder];\n    $('.inbox-breadcrumb span:last-child').textContent = selectedFolder === location ? '1 example message' : '0 example messages';\n    $('#software-message').hidden = selectedFolder !== location;\n    $('#software-empty').hidden = selectedFolder === location;\n    $('#software-empty-copy').textContent = `Your message is in ${folders[location]}.`;\n    $$('[data-folder]').forEach(button => {\n      button.setAttribute('aria-pressed', String(button.dataset.folder === selectedFolder));\n      button.classList.toggle('contains-message', button.dataset.folder === location);\n      button.querySelector('b').textContent = button.dataset.folder === location ? '1' : '0';\n    });\n    $('#software-answer').textContent = answered ? example.label : 'Not asked yet';\n    $('#software-answer-status').textContent = answered ? (example.confidence < 0.5 ? 'Mixed' : 'Label added') : 'Waiting';\n    $('.suggestion-strip').classList.toggle('answered', answered);\n    $('#software-clue').textContent = answered\n      ? (example.confidence < 0.5 ? 'This prepared answer is mixed. Our rule asks a person.' : 'This is a label, not a reply, refund or completed task.')\n      : 'The app asks: \u201cWhich team should handle this?\u201d';\n    $('#software-normal').setAttribute('aria-pressed', String(!state.reviewAll));\n    $('#software-review').setAttribute('aria-pressed', String(state.reviewAll));\n    $('#software-rule-copy').textContent = state.reviewAll\n      ? 'Every message waits for a person. Jev\u2019s answer stays the same.'\n      : 'Use the suggested team when clear. Ask a person when unclear.';\n    $('#software-next').disabled = state.moving && !state.paused;\n    const label = state.moving\n      ? (state.paused ? 'Continue this step' : 'Following the message\u2026')\n      : ['Ask Jev', 'Check the rule', 'Move the message', 'Replay the example'][state.stop];\n    $('#software-next').innerHTML = `${label} <span aria-hidden=\"true\">\u2192</span>`;\n    $('#software-next-hint').textContent = `Step ${state.stop + 1} of 4`;\n    $('#software-activity').textContent = state.stop === 3\n      ? `Moved to ${LABELS[destination]}`\n      : state.moving && state.target === 3\n        ? `Moving to ${LABELS[destination]}\u2026`\n        : planned ? `Ready to move to ${LABELS[destination]}` : 'Still in Unassigned';\n    $('#software-activity-copy').textContent = state.stop === 3\n      ? 'Your app moved this example. A person still needs to help.'\n      : planned ? 'The rule is checked. Use Move the message to apply it.' : 'Jev supplies the label. Only your app moves the message.';\n    $('.inbox-activity').classList.toggle('delivered', state.stop === 3);\n    $('.inbox-activity').classList.toggle('human', destination === 'human' && planned);\n  }\n\n  function resetFolder() {\n    selectedFolder = lastLocation;\n    update();\n  }\n\n  function targets() {\n    const result = {};\n    for (const name of ['message', 'label', 'rule', 'folder']) {\n      const rect = $(`[data-map-target=\"${name}\"]`).getBoundingClientRect();\n      result[name] = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };\n    }\n    return result;\n  }\n\n  update();\n  return { update, resetFolder, targets, selectedFolder: () => selectedFolder };\n}\n".replaceAll("'./journey.js'",JSON.stringify(urls.journey)));

.',state.sample===3?'This example also points to Billing. The answer is mixed.':'Jev supplies a label. It has not replied, refunded or moved anything.'],\n    ['Your rule decides the route.',state.reviewAll?'You asked for a person every time. The suggested label stays the same.':human?'Our example asks a person when an answer is unclear.':'Our example uses the suggested team when the answer is clear.'],\n    [human?'A person gets the message.':e.label+' gets the message.',human?'The app chose human review. It did not change Jev\u2019s suggestion.':'Your app did the moving. A team member still needs to help.']\n  ][state.stop];\n}\nfunction updateUI(force=false) {\n  const signature=JSON.stringify([state.sample,state.stop,state.moving,state.target,state.paused,state.auto,state.reviewAll,state.progress>=1,state.progress>=2,graphicsMode,representation]);\n  if(!force&&signature===lastSignature)return;\n  lastSignature=signature;\n  const e=journey.current(),d=journey.destination(),[title,copy]=copyFor();\n  $('#message').textContent=e.text;$('#postage').textContent=e.icon;\n  $('#lesson-title').textContent=title;$('#lesson-copy').textContent=copy;\n  $('#stop-label').textContent=`${state.stop+1} / 4 \u00b7 ${names[state.stop]}`;\n  $$('.journey-stops button').forEach((b,i)=>{if(i===state.stop)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');b.classList.toggle('done',i<state.stop);});\n  $('#next').disabled=state.moving&&!state.paused;\n  $('#next').innerHTML=(state.moving?(state.paused?'Continue this step':'Following the envelope\u2026'):['Send to Jev','Check my app\u2019s rule','Move the message','Replay this message'][state.stop])+' <b aria-hidden=\"true\">\u2192</b>';\n  $('#pause').disabled=!state.moving&&!state.auto;\n  $('#pause').textContent=state.paused?'\u25b6':'\u2161';$('#pause').setAttribute('aria-label',state.paused?'Resume animation':'Pause animation');\n  $('#pause').setAttribute('aria-pressed',String(state.paused));\n  $('#watch').textContent=state.auto?(state.paused?'\u25b6 Continue the whole trip':'\u2161 Pause the whole trip'):'\u25b6 Watch the whole trip';\n  $('#watch').setAttribute('aria-pressed',String(state.auto&&!state.paused));\n  $('#review-all').checked=state.reviewAll;\n  $('#answer').textContent=state.progress>=1?e.label:'Not asked yet';\n  $('#answer-copy').textContent=state.progress>=1?(state.sample===3?'Mixed answer in this example.':'A label, not a completed task.'):'It chooses a label.';\n  $('#result').textContent=state.progress>=2?LABELS[d]:'Not moved yet';\n  $('#action-heading').textContent=state.stop===3?'YOUR APP SENT TO':state.progress>=2?'YOUR APP WILL SEND TO':'YOUR APP SENDS TO';\n  $('#result-copy').textContent=state.stop===3?'Only the example envelope moved.':state.progress>=2?(state.reviewAll?'Your rule asks a person.':d==='human'?'Our rule asks a person when unclear.':'Your rule allows this team.'):'It follows your rule.';\n  $('.outcome.action').classList.toggle('human',d==='human'&&state.progress>=2);\n  $('.outcome.suggestion').classList.toggle('revealed',state.progress>=1);$('.outcome.action').classList.toggle('revealed',state.progress>=2);\n  $('#announcer').textContent=title+' '+copy;\n  if(graphicsMode==='diagram')drawDiagram();\n  softwareView?.update();\n}\nfunction updateVisual(){if(machine)machine.update(state.progress,journey.destination(),journey.current().label,state.stop);else if(graphicsMode==='diagram')drawDiagram();}\nfunction showToast(text){clearTimeout(toastTimer);$('#toast').textContent=text;toastTimer=setTimeout(()=>$('#toast').textContent='',4200);}\nfunction markers(points,stop,dest) {\n  $('#markers').hidden=representation==='software';\n  for(const[id,p]of Object.entries(points)){\n    const el=id==='envelope'?$('#envelope-marker'):$(`[data-marker=\"${id}\"]`);if(!el)continue;\n    el.style.left=(p.x+$('#stage').offsetLeft)+'px';el.style.top=(p.y+$('#stage').offsetTop-10)+'px';\n    el.classList.toggle('active',id===['message','jev','app'][stop]||(stop===3&&id===dest));\n    el.hidden=!p.visible||(id==='envelope'&&!highlight)||(innerWidth<730&&['returns','shipping','billing','human'].includes(id)&&!(stop===3&&id===dest));\n  }\n}\nfunction diagramMarkup(){\n  return `<div class=\"diagram-wrap\"><svg id=\"diagram\" viewBox=\"0 0 800 470\" role=\"img\" aria-label=\"The same message passes through Jev and your app to one destination\"><defs><pattern id=\"papergrid\" width=\"24\" height=\"24\" patternUnits=\"userSpaceOnUse\"><path d=\"M24 0H0V24\" fill=\"none\" stroke=\"#dedccf\" stroke-width=\"0.6\"/></pattern></defs><rect width=\"800\" height=\"470\" fill=\"url(#papergrid)\"/><path d=\"M105 220H460\" stroke=\"#b9bbaa\" stroke-width=\"22\" fill=\"none\" stroke-linecap=\"round\"/>${Object.keys(LABELS).map((id,i)=>`<path id=\"path-${id}\" d=\"M460 220Q535 220 555 ${65+i*108}H706\" stroke=\"#cdd1c3\" stroke-width=\"14\" fill=\"none\"/><rect id=\"tray-${id}\" x=\"641\" y=\"${37+i*108}\" width=\"130\" height=\"56\" rx=\"10\" fill=\"#eceadd\" stroke=\"#c7c9bc\"/><text x=\"706\" y=\"${72+i*108}\" text-anchor=\"middle\" fill=\"#344a3e\" font-size=\"19\">${LABELS[id]}</text>`).join('')}<rect x=\"258\" y=\"150\" width=\"92\" height=\"140\" rx=\"13\" fill=\"#84649b\"/><text x=\"304\" y=\"190\" fill=\"#fff8e8\" text-anchor=\"middle\" font-size=\"28\">Jev</text><rect x=\"430\" y=\"163\" width=\"62\" height=\"114\" rx=\"20\" fill=\"#315247\"/><text x=\"462\" y=\"314\" text-anchor=\"middle\" fill=\"#315247\" font-size=\"21\">Your app</text><text x=\"105\" y=\"293\" text-anchor=\"middle\" fill=\"#566454\" font-size=\"19\">Message</text><g id=\"diagram-letter\"><rect x=\"-35\" y=\"-23\" width=\"70\" height=\"46\" rx=\"3\" fill=\"#fff8e6\" stroke=\"#ba9c67\" stroke-width=\"2\"/><path d=\"M-33-21L0 6L33-21\" fill=\"none\" stroke=\"#ba9c67\" stroke-width=\"2\"/><rect id=\"diagram-sticker\" x=\"-25\" y=\"8\" width=\"50\" height=\"9\" fill=\"#84649b\"/></g></svg></div>`;\n}\nfunction drawDiagram(){\n  if(!$('#diagram'))return;\n  const p=state.progress,d=journey.destination(),i=Object.keys(LABELS).indexOf(d);let x,y=220;\n  if(p<=1)x=105+(304-105)*p;\n  else if(p<=2)x=304+(460-304)*(p-1);\n  else {const f=Math.max(0,(p-2.3)/0.7),path=$('#path-'+d),point=path.getPointAtLength(path.getTotalLength()*f*f*(3-2*f));x=point.x;y=point.y;}\n  $('#diagram-letter').setAttribute('transform',`translate(${x},${y})`);$('#diagram-sticker').setAttribute('opacity',p>=1?'1':'0');\n  for(const id of Object.keys(LABELS)){$('#path-'+id).setAttribute('stroke',p>2&&id===d?'#8f9f82':'#cdd1c3');$('#tray-'+id).setAttribute('fill',state.stop===3&&id===d?'#d5dfc9':'#eceadd');}\n}\nfunction setDiagram(isManual=true){\n  initGeneration++;manualDiagram=isManual;machine?.dispose();machine=null;graphicsMode='diagram';\n  $('#stage').innerHTML=diagramMarkup();$('#markers').hidden=true;\n  $('#render-note').textContent=isManual?'Diagram view \u00b7 Same message, same rules':'3D unavailable here \u00b7 Diagram keeps every step usable';\n  $('#find-letter').disabled=true;setViewButtons('diagram');updateUI(true);drawDiagram();\n}\nfunction setViewButtons(name){$$('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));}\nasync function start3D(view='studio'){\n  const generation=++initGeneration;manualDiagram=false;\n  if(machine){machine.home(view);setViewButtons(view);return;}\n  graphicsMode='loading';$('#stage').innerHTML='<p class=\"loading\">Opening the message workshop\u2026</p>';\n  try{\n    if(!machineFactory)machineFactory=(await import('./sorter.js')).makeMachine;\n    if(generation!==initGeneration)return;\n    $('#stage').replaceChildren();\n    machine=machineFactory($('#stage'),markers,new URLSearchParams(location.search).get('renderer')||'auto');\n    graphicsMode=machine.inspect().renderer;machine.home(view);machine.highlight(highlight);machine.suspend?.(representation==='software');updateVisual();\n    $('#render-note').textContent='Drag to look around \u00b7 Pinch or scroll to zoom';\n    $('#find-letter').disabled=false;setViewButtons(view);updateUI(true);\n  }catch(error){window.__JEV_GRAPHICS_ERROR=String(error);if(generation===initGeneration)setDiagram(false);}\n}\nfunction pause(){if(state.moving||state.auto){state.paused=!state.paused;updateUI();}}\nfunction next(){\n  if(state.moving){if(state.paused)state.paused=false;updateUI();return;}\n  if(state.stop===3)journey.reset();else{state.auto=false;journey.advance();}\n  updateUI();updateVisual();\n}\nfunction whyText(){const e=journey.current();return state.reviewAll?'You turned on \u201cAsk a person every time.\u201d That rule overrides the suggested destination, not the suggested label.':routeFor(e)==='human'?'This prepared example points to two teams. Our app asks a person rather than silently choosing one action.':`This prepared answer suggests ${e.label}. Our app\u2019s rule allows a clear answer to go to the suggested team.`;}\nfunction showPanel(kind){\n  if(state.moving||state.auto)state.paused=true;\n  let title,body;\n  const link=(url,text)=>`<a href=\"${url}\" target=\"_blank\" rel=\"noopener noreferrer\">${text} \u2197</a>`;\n  if(kind==='examples'){\n    title='Try another customer.';\n    body=`<div class=\"examples\">${EXAMPLES.map((e,i)=>`<button data-example=\"${i}\" aria-pressed=\"${state.sample===i}\"><span class=\"sample-icon\">${e.icon}</span><span><b>${e.name}</b><p>${escapeHTML(e.text)}</p></span></button>`).join('')}</div><p class=\"small\">Every message and answer is prepared for teaching. Picking a message does not call Jev.</p>`;\n  }else if(kind==='build'){\n    title='Turn the idea into your app.';\n    body=`<div class=\"build-steps\"><section><span class=\"role-icon\">\u270e</span><div><b>You describe the job.</b><p>\u201cBuild me an inbox that suggests which team should help.\u201d</p></div></section><section><span class=\"role-icon\">\u2318</span><div><b>Your coding assistant builds it.</b><p>The TypeSafe skill is its instruction booklet for connecting to Jev.</p></div></section><section><span class=\"role-icon\">\u21c4</span><div><b>The finished app asks Jev.</b><p>Jev returns an answer. Your app applies your rule.</p></div></section></div><button class=\"primary\" data-panel=\"prompt\">Get my starter prompt <b>\u2197</b></button><p class=\"small\">Nothing is connected by this exhibit. ${link(sources.skill,'Official skill instructions')}</p>`;\n  }else if(kind==='prompt'){\n    title='Give this to your coding assistant.';\n    body=`<p>No technical vocabulary required. Read it first, then copy it.</p><div id=\"starter\" class=\"prompt\" tabindex=\"0\">${escapeHTML(prompt)}</div><button id=\"copy\" class=\"primary\">Copy the prompt</button><p class=\"small\">This is a project brief, not a live integration. No key is requested here.</p>`;\n  }else if(kind==='why'){\n    title='Same suggestion. Your decision.';\n    body=`<div class=\"route-receipt\"><span>PREPARED ANSWER</span><b>${journey.current().label}</b><span>YOUR APP\u2019S DESTINATION</span><b>${LABELS[journey.destination()]}</b></div><p>${whyText()}</p><p class=\"small\">${journey.current().clue} This is the example\u2019s explanation, not a claim to reveal the model\u2019s private reasoning.</p><button class=\"primary\" id=\"try-rule\">${state.reviewAll?'Use the normal example rule':'Try asking a person every time'} <b>\u2192</b></button>`;\n  }else if(kind==='sources'){\n    title='What is real? What is illustrated?';\n    body=`<p>${link(sources.choice,'TypeSafe: Choice')} explains choosing among named options and includes a shoe shop routing example.</p><p>${link(sources.skill,'TypeSafe: Agent skill')} explains how a coding assistant learns to build the integration.</p><p><b>The software view:</b> a fictional Step & Co. inbox, not a TypeSafe product screen or connected account. The same prepared message and rule drive both views.</p><p><b>Our illustration:</b> four prepared messages, preset answers, and a made up office machine. The conveyor is a metaphor for software. It is not Jev hardware.</p><details><summary>Example numbers and limits</summary><p>The mixed message uses the documentation\u2019s illustrative answer shape: Returns 0.60, Billing 0.38, Shipping 0.02; confidence 0.39. These are different quantities. Our teaching app uses a 0.50 review cutoff, not a recommended universal value. The three simple fixtures use confidence 1. No probabilities here were measured from your account.</p><p>In a real app, validate outputs, include unmatched cases, test your rules, and keep private keys on your server.</p></details><p class=\"small\">Official pages rechecked 17 September 2026. Independent educational exhibit. No live requests or performance measurements.</p>`;\n  }else{\n    title='Software, made visible.';\n    body=`<div class=\"big-idea\"><span class=\"violet-text\">Jev supplies a label.</span><span class=\"green-text\">Your app performs an action.</span></div><p>The envelope is the same message all the way through. The purple reader stands for Jev. The green turning bridge stands for your app following its rule.</p><p>This is a teaching model, not a real inbox, Jev hardware, or a force simulation. No reply, refund or real customer action occurs.</p><p class=\"small\">Use the numbered stops to jump. Space pauses or continues playback. R replays. Focus the canvas and use arrow keys to rotate it. Reduced motion uses immediate steps.</p><div class=\"panel-links\"><button data-panel=\"sources\">Sources and limits \u2197</button><button data-panel=\"build\">Build this idea \u2197</button></div>`;\n  }\n  $('#dialog').innerHTML=`<div class=\"dialog-top\"><p class=\"eyebrow\">JEV IN MOTION</p><button id=\"close\" aria-label=\"Close explanation\">\u00d7</button></div><h2 id=\"dialog-title\">${title}</h2>${body}`;\n  if(!$('#dialog').open)$('#dialog').showModal();$('#dialog').scrollTop=0;updateUI();\n}\nasync function copyPrompt(){try{await navigator.clipboard.writeText(prompt);$('#copy').textContent='Copied';showToast('Copied. Paste it into your coding assistant.');}catch{const sel=getSelection(),range=document.createRange();range.selectNodeContents($('#starter'));sel.removeAllRanges();sel.addRange(range);$('#copy').textContent='Text selected';showToast('Copy the selected text. Automatic copying is unavailable here.');}}\ndocument.addEventListener('click',e=>{\n  const b=e.target.closest('button');if(!b)return;\n  if(b.dataset.panel){showPanel(b.dataset.panel);return;}\n  if(b.dataset.example!==undefined){journey.reset(Number(b.dataset.example));$('#dialog').close();updateUI();updateVisual();return;}\n  if(b.dataset.stop!==undefined){journey.seek(b.dataset.stop);updateUI();updateVisual();return;}\n  if(b.dataset.view){if(b.dataset.view==='diagram')setDiagram();else start3D(b.dataset.view);return;}\n  if(b.id==='next')next();\n  if(b.id==='pause')pause();\n  if(b.id==='replay'){journey.reset();updateUI();updateVisual();}\n  if(b.id==='watch'){if(state.auto)pause();else{journey.play();updateUI();updateVisual();}}\n  if(b.id==='close')$('#dialog').close();\n  if(b.id==='copy')copyPrompt();\n  if(b.id==='find-letter'){highlight=!highlight;machine?.highlight(highlight);b.setAttribute('aria-pressed',String(highlight));b.textContent=highlight?'Envelope marked':'Find the envelope';}\n  if(b.id==='try-rule'){journey.policy(!state.reviewAll);$('#dialog').close();updateUI();updateVisual();showToast('Rule changed. Jev\u2019s prepared answer stays the same.');}\n});\n$('.brand').addEventListener('click',e=>{e.preventDefault();journey.reset();updateUI();updateVisual();});\n$('#review-all').addEventListener('change',e=>{applyPolicy(e.target.checked);});\n$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#dialog').close();}});\n$('#dialog').addEventListener('close',()=>updateUI());\ndocument.addEventListener('keydown',e=>{\n  if($('#dialog').open||['BUTTON','INPUT','TEXTAREA','A','CANVAS'].includes(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;\n  if(e.code==='Space'){e.preventDefault();if(state.moving||state.auto)pause();else next();}\n  if(e.key.toLowerCase()==='r'){journey.reset();updateUI();updateVisual();}\n});\nmedia.addEventListener('change',e=>{state.reduced=e.matches;updateUI();});\ndocument.addEventListener('visibilitychange',()=>{last=performance.now();});\n$('#stage').addEventListener('graphicslost',()=>setDiagram(false));\nlet resizeTimer;\nwindow.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(graphicsMode==='diagram')drawDiagram();},120);});\nfunction frame(now){const dt=(now-last)/1000;last=now;if(!document.hidden&&!$('#dialog').open&&journey.tick(dt)){updateUI();updateVisual();}requestAnimationFrame(frame);}\nupdateUI();\nif(new URLSearchParams(location.search).get('view')==='diagram')setDiagram();else start3D();\nrequestAnimationFrame(frame);\nwindow.JEV_EXHIBIT={version:'software-3.1',state,examples:EXAMPLES,destination:journey.destination,seek(n){journey.seek(n);updateUI();updateVisual();},reset(n){journey.reset(n);updateUI();updateVisual();},advance(){journey.advance();updateUI();updateVisual();},inspect:()=>({version:'software-3.1',state:{...state},destination:journey.destination(),machine:machine?.inspect()||null,graphicsMode,manualDiagram,representation,selectedFolder:softwareView.selectedFolder()}),poseAt,routeFor,GEO,ANGLES};\n\n// An optional direct entry to the same example software, without an account or API call.\nif (location.hash === '#software') changeRepresentation();\n".replaceAll("'./journey.js'",JSON.stringify(urls.journey)).replaceAll("'./sorter.js'",JSON.stringify(urls.sorter)).replaceAll("'./software-view.js'",JSON.stringify(urls.software)));
